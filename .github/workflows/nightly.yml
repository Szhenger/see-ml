# =============================================================================
# Nightly — the invariant checks too slow (or too statistical) to gate every
# pull request, run daily against main and on demand:
#
#   ThreadSanitizer   the whole suite set under TSan — the concurrency
#                     integration tests (racing durable writers, concurrent
#                     engines on the shared pool, pipeline teardown, chunk
#                     exceptions) execute with the race detector watching,
#                     turning "bounded behavior" from assertion into proof
#   extended fuzz     15 minutes over the four untrusted-input arms, with
#                     the corpus carried between runs via the actions cache
#   bench             the Tier A throughput gate: seeml-bench against the
#                     previous night's cached baseline, >10% rows/s
#                     regression fails (docs/benchmarks.md)
#
# A nightly failure is a regression on main itself, not on a diff — treat
# it with the same severity as a red PR.
# =============================================================================

name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      reseed_baseline:
        description: >-
          Skip the Tier A gate and store this run as the new rolling
          baseline (after a fixture/metric rename the fail-closed gate
          would otherwise stay red; the epoch baseline is left alone).
        type: boolean
        default: false

jobs:
  tsan:
    name: ThreadSanitizer (full suites)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CXX: clang++-19
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSEEML_SANITIZE=thread
      - name: Build
        run: cmake --build build-tsan -j "$(nproc)"
      - name: Test under TSan
        run: ctest --test-dir build-tsan --output-on-failure

  fuzz-extended:
    name: fuzz (15 min, cached corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CXX: clang++-19
      CC: clang-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Configure
        run: cmake -S . -B build-fuzz -DSEEML_FUZZ=ON
      - name: Build harness
        run: cmake --build build-fuzz -j "$(nproc)" --target seeml_fuzz_formats
      - name: Fuzz
        run: |
          mkdir -p corpus
          ./build-fuzz/seeml_fuzz_formats -max_total_time=900 \
            -print_final_stats=1 corpus
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  # The Tier A regression gate of docs/benchmarks.md: run the harness, diff
  # against the last green night's numbers (carried by the actions cache,
  # the fuzz-corpus trust model). Cloud runners of one class differ by
  # 15-35% on identical work, so the gate is calibration-normalized and
  # two-consecutive-red (P5, #79): seeml-bench times a frozen reference
  # kernel, bench_compare.py divides the runner out of every delta, a key's
  # first >10% regression is a warning and its second consecutive one fails
  # the job. bench_compare.py --promote owns the baseline roll: only a fully
  # green gate replaces it, so a warned night is never the next reference.
  bench:
    name: bench (Tier A regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Restore baseline
        uses: actions/cache@v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.run_id }}
          restore-keys: bench-baseline-
      # The pinned epoch: a fixed cache key is saved once and never
      # overwritten, so the gate also diffs against a reference that does
      # not roll forward (a <10%/night drift cannot compound past it).
      # Bump the key suffix to start a new epoch deliberately (v2: the
      # first epoch that carries a calibration block — v1 was an
      # un-normalizable high-water mark from one fast runner).
      - name: Restore epoch baseline
        uses: actions/cache@v4
        with:
          path: bench-epoch
          key: bench-epoch-v2
      - name: Configure
        run: >
          cmake -S . -B build-bench
          -DCMAKE_BUILD_TYPE=Release
          -DSEEML_BENCH=ON
      - name: Build harness
        run: cmake --build build-bench -j "$(nproc)" --target seeml-bench
      - name: Bench
        run: ./build-bench/seeml-bench --out bench.json --threads 1,2,4
      # A reseed drops the rolling baseline and the pending reds, never the
      # epoch (bump its key instead); the gate step then seeds from this run.
      - name: Drop the baseline (reseed only)
        if: ${{ inputs.reseed_baseline }}
        run: rm -f bench-baseline/bench.json bench-baseline/gate_state.json
      - name: Gate against baseline
        run: |
          epoch="--epoch-baseline bench-epoch/bench.json"
          if [ "${{ inputs.reseed_baseline }}" = "true" ]; then epoch=""; fi
          python3 tool/bench_compare.py bench-baseline/bench.json bench.json \
            $epoch --state bench-baseline/gate_state.json --promote \
            | tee bench-gate.log
          exit "${PIPESTATUS[0]}"
      - name: Upload run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench
          path: |
            bench.json
            bench-gate.log
            bench-baseline/gate_state.json
          if-no-files-found: ignore
