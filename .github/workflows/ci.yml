# =============================================================================
# CI — the per-diff invariant gate. Every pull request (and every push to
# main) must re-prove the three properties the project is built around:
#
#   correctness   build+test on every supported toolchain, ASan+UBSan over
#                 the full suite set, and a bounded fuzz pass over the four
#                 untrusted-input arms (SMF / SEEU / SDS / compile-of-SMF)
#   determinism   the bitwise-invariance suites re-run under SEEML_THREADS
#                 in {1, 3, 8}, so every "same bits at any width" assertion
#                 executes against genuinely different worker-pool shapes
#   boundedness   the seeded distribution-bound and concurrency-race tests
#                 run in every matrix cell; the slow ThreadSanitizer pass
#                 over the same races lives in nightly.yml
#
# The suites themselves carry the assertions; CI's job is to run them on
# configurations a developer machine does not (other OS/compilers,
# sanitizers, varied pool widths) and to refuse the merge when any fails.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Correctness: the supported-toolchain matrix ---------------------------
  # README promises clang or gcc, CMake optional: the shell driver is the
  # canonical build here. macOS additionally exercises the ObjC++ Metal
  # harness (the suite degrades to a note when the runner has no device).
  #
  # Linux toolchains are pinned explicitly (g++-14, clang++-19 from
  # apt.llvm.org): the code is std::expected-native, and libstdc++ hides
  # <expected> behind __cpp_concepts >= 202002L — a macro Clang defines
  # only from 19 (Ubuntu's clang 18.1 + noble's pre-14.1 libstdc++ can
  # never see the template). Pinning turns runner-image rotations from
  # red builds into non-events.
  #
  # Every toolchain-install step is bounded (wget read-timeout, 3 retries,
  # step timeout-minutes): apt.llvm.org throttles the Actions IP space at
  # times, and an unbounded fetch turns that stall into the whole job
  # budget (observed 2026-08-19: four jobs dead at their ceilings without
  # compiling a line). A stall now costs minutes and usually self-heals.
  #
  # Each install step first drops the runner image's third-party apt
  # sources (Google Chrome, Microsoft): none are needed, and a stale index
  # on one fails every apt-get update, including the one inside llvm.sh.
  build-and-test:
    name: test (${{ matrix.os }}, ${{ matrix.cxx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++-14 }
          - { os: ubuntu-latest, cxx: clang++-19 }
          - { os: macos-latest, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if sudo apt-get update -q && sudo apt-get install -y -q g++-14 &&
               wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "toolchain install attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Toolchain version
        run: $CXX --version
      - name: Build (shell driver, no CMake)
        run: sh build/build.sh
      - name: Run every suite
        run: |
          fail=0
          for t in build/seeml_*_test; do
            echo "== $t"
            "$t" || fail=1
          done
          exit $fail

  # --- Determinism: identical bits at every pool width -----------------------
  # SEEML_THREADS pins the global worker pool. The bitwise assertions inside
  # the suites (plan bytes, persist segments, kernel outputs, hashes) then
  # execute serially, at an odd width, and wide — any scheduling-dependent
  # numeric would trip at least one width.
  determinism:
    name: determinism (widths 1/3/8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Build
        run: sh build/build.sh
      - name: Run all suites at each width
        run: |
          fail=0
          for w in 1 3 8; do
            echo "==== SEEML_THREADS=$w"
            for t in build/seeml_*_test; do
              SEEML_THREADS=$w "$t" > /tmp/out.log 2>&1 || {
                echo "FAILED at width $w: $t"
                cat /tmp/out.log
                fail=1
              }
            done
          done
          exit $fail

  # --- Correctness: Address + UndefinedBehavior sanitizers -------------------
  # The bug class the reviews kept surfacing (e.g. a float->int8 cast of
  # clamp(NaN)) is exactly what UBSan turns from silent corruption into a
  # red build. Uses the CMake path, which carries the sanitizer plumbing.
  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CXX: clang++-19
      ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSEEML_SANITIZE="address;undefined"
      - name: Build
        run: cmake --build build-san -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  # --- Correctness: bounded fuzz over the untrusted-input arms ---------------
  # 90 seconds per PR is a smoke pass, not a campaign (nightly runs the long
  # one): it still catches shallow regressions in the reader/validator
  # rejection paths that a hand-written test didn't anticipate.
  fuzz-smoke:
    name: fuzz (90s smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CXX: clang++-19
      CC: clang-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: cmake -S . -B build-fuzz -DSEEML_FUZZ=ON
      - name: Build harness
        run: cmake --build build-fuzz -j "$(nproc)" --target seeml_fuzz_formats
      - name: Fuzz
        run: |
          mkdir -p corpus
          ./build-fuzz/seeml_fuzz_formats -max_total_time=90 \
            -print_final_stats=1 corpus
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            corpus
          if-no-files-found: ignore

  # --- Correctness: the product contract, end to end -------------------------
  # The strongest claim in the docs — "the emitted package builds and runs
  # with no access to this repository" — exercised for real: PyTorch export
  # -> compile -> the package's own generated build.sh -> model_update
  # training, gating, and committing on-device style. Then the determinism
  # invariant at the artifact level: a fully serial re-run must commit a
  # BITWISE-identical model. Outcome-robust: if the seeded demo's gate
  # rejects (exit 3), the run is retried with --force — the invariants
  # under test are build/run/commit/determinism, not the demo's luck.
  e2e-package:
    name: e2e (export -> compile -> package -> update)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      # The pinned build-host stack (tool/requirements-pinned.txt): CPython
      # 3.14.7 with torch 2.14 and NumPy 2.5 from the CPU wheel index.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: tool/requirements-pinned.txt
      - name: Install the pinned exporter stack (CPU torch)
        run: pip install --index-url https://download.pytorch.org/whl/cpu -r tool/requirements-pinned.txt
      - name: Exporter suite with torch (oracles, golden digests)
        run: python3 -m unittest discover -s test/tool -p 'export_model_test.py' -v
      - name: Export the demo model + corpus
        run: python3 -W error tool/export_model.py --demo out/
      - name: Build the compiler
        run: sh build/build.sh
      - name: Compile the plan and build the emitted package
        run: |
          ./build/seeml-update-compile --source out/model.smf --out out/pkg \
            --data-batch 16 --loss xent --lora-rank 8 --lr 5e-3 --steps 300 \
            --report out/pkg/report.json --build
          test -x out/pkg/model_update
      - name: Verify the plan seal with the disassembler
        run: ./build/seeml-seeu-dump out/pkg/update_plan.seeu | grep -q "(verified)"
      - name: Run the update (parallel), tolerating a gate rejection
        run: |
          set +e
          out/pkg/model_update --model out/model.smf --data out/corpus.sds \
            --out out/updated.smf --seed 7 --val-frac 0.1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "gate: improved and committed"
            echo "E2E_FORCE=" >> "$GITHUB_ENV"
          elif [ "$rc" -eq 3 ]; then
            echo "gate: rejected — exercising the commit path with --force"
            out/pkg/model_update --model out/model.smf --data out/corpus.sds \
              --out out/updated.smf --seed 7 --val-frac 0.1 --force
            echo "E2E_FORCE=--force" >> "$GITHUB_ENV"
          else
            echo "model_update failed with a real error ($rc)"
            exit "$rc"
          fi
          test -s out/updated.smf
      - name: Serial re-run commits a bitwise-identical model
        run: |
          # The gate's verdict is deterministic (same data, seed, and plan;
          # thread count never changes bits), so the parallel run's verdict
          # carries over — a divergence would itself be a determinism bug
          # and correctly fails this step.
          SEEML_THREADS=1 out/pkg/model_update --model out/model.smf \
            --data out/corpus.sds --out out/updated_serial.smf \
            --seed 7 --val-frac 0.1 ${E2E_FORCE}
          cmp out/updated.smf out/updated_serial.smf
          echo "serial and parallel commits are bitwise identical"
      # The Python-plane package assembler (P1, #75): the same compile with
      # --no-embed leaves no decimal TU; tool/pack_update.py embeds the plan
      # as an .incbin stub and drives the same build.sh. Acceptance: the
      # .seeu is byte-identical to the default emission, the package still
      # carries nothing Python, and the stub-built binary commits the very
      # same bytes as the decimal-built one.
      - name: Pack the plan with .incbin instead of the decimal TU
        run: |
          ./build/seeml-update-compile --source out/model.smf --out out/pkg2 \
            --data-batch 16 --loss xent --lora-rank 8 --lr 5e-3 --steps 300 \
            --report out/pkg2/report.json --no-embed
          test ! -e out/pkg2/update_plan_embedded.cc
          cmp out/pkg/update_plan.seeu out/pkg2/update_plan.seeu
          python3 tool/pack_update.py out/pkg2 --build --report out/pack.json
          test -x out/pkg2/model_update
          test -f out/pkg2/update_plan_embedded.S
          # Nothing Python ships in the package: no interpreter reference in
          # any source the device builds, none in the binary.
          ! grep -rIl -i python out/pkg2 --include='*.cc' --include='*.h' \
              --include='*.S' --include='*.sh'
          ! grep -q -i python out/pkg2/model_update
      - name: Stub-built package commits the same bytes as the decimal one
        run: |
          out/pkg2/model_update --model out/model.smf --data out/corpus.sds \
            --out out/updated_incbin.smf --seed 7 --val-frac 0.1 ${E2E_FORCE}
          cmp out/updated.smf out/updated_incbin.smf
          echo ".incbin and decimal packages commit bitwise-identical models"
      # The packer also upgrades a package from a pre-P1 compiler by
      # rewriting its one decimal compile line. Exercised against the real
      # emitter's text (this package's build.sh with the stub branch folded
      # back to the v1.2.4 line), without paying for a third runtime build:
      # the rewritten script must carry the stub line and still parse.
      - name: Packer upgrades a pre-P1 package's build.sh
        run: |
          cp -R out/pkg out/pkg_legacy
          python3 - <<'PY'
          import re
          p = "out/pkg_legacy/build.sh"
          s = open(p).read()
          legacy = re.sub(r"# The plan reaches the binary.*?\nfi\n",
                          "$CXX $FLAGS -c update_plan_embedded.cc -o update_plan_embedded.o\n",
                          s, flags=re.S)
          assert legacy != s and "update_plan_embedded.S" not in legacy
          open(p, "w").write(legacy)
          PY
          python3 tool/pack_update.py out/pkg_legacy
          grep -q '^\$CXX -c update_plan_embedded.S -o update_plan_embedded.o$' out/pkg_legacy/build.sh
          test ! -e out/pkg_legacy/update_plan_embedded.cc
          sh -n out/pkg_legacy/build.sh

  # --- Correctness: the Python plane, torch-free -----------------------------
  # Torch is deliberately not installed (heavy; the exporter's torch imports
  # are function-local): byte-compiling every tool script gates syntax and
  # top-level import errors, and the packer's suite runs under a bare
  # interpreter — it is tier 0 (stdlib only), and a stray import fails here.
  # Two interpreters: the pinned 3.14.7 and the 3.9 floor, so no tool grows
  # syntax or a stdlib API the oldest supported build host lacks.
  python-tools:
    name: python tools (${{ matrix.python }}, syntax + packer suite)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every tool script
        run: python -m py_compile tool/export_model.py tool/bench_compare.py tool/pack_update.py
      - name: Packer unit tests (assembles the stub with the runner's g++)
        run: python -m unittest discover -s test/tool -p '*_test.py' -v

  # --- Correctness: the exporter across its NumPy floor and the pinned stack -
  # The streaming container writer and the vectorized corpus writer must
  # produce the bytes the original per-row / whole-blob algorithms did (the
  # oracles live in the suite), on NumPy 1.x under the 3.9 floor and on
  # NumPy 2.5 under 3.14.7. No torch: --demo-decoder and --corpus are the
  # NumPy-only paths, and their default outputs are pinned by digest.
  exporter-compat:
    name: exporter (py ${{ matrix.python }}, numpy ${{ matrix.numpy }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", numpy: "<2" }
          - { python: "3.14.7", numpy: "==2.5.3" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install NumPy only
        run: pip install "numpy${{ matrix.numpy }}"
      - name: Exporter suite (oracles + golden digests, torch tests skip)
        run: python -m unittest discover -s test/tool -p 'export_model_test.py' -v
      - name: NumPy-only export paths run warning-free
        run: |
          python -W error tool/export_model.py --demo-decoder out/
          python -W error -c "import numpy as np; np.savez('out/f.npz', inputs=np.zeros((10, 4), np.float32), labels=np.arange(10) % 3)"
          python -W error tool/export_model.py --corpus out/f.npz out/f.sds
